name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run canonical Bluesky archive contract tests
        run: npm run test:archive-contract

      - name: Verify the archive conformance checker still rejects bad archives
        run: npm run test:archive-conformance

      - name: Run the Cyd Bluesky archive v2 conformance matrix
        # The release gate for Mobile's version 2 writer (#100, ADR 0004). It
        # fails both when a matrix row goes red and when the test proving one
        # has been renamed or deleted out from under it.
        run: npm run test:archive-matrix

      - name: Check for a newer canonical Bluesky archive bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/archive-contract/check_latest.py
